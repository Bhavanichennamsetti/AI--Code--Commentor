<svg width="620" height="460" viewBox="0 0 620 460" fill="none" xmlns="http://www.w3.org/2000/svg">

    <defs>
        <linearGradient
            id="windowGradient"
            x1="80"
            y1="40"
            x2="540"
            y2="420"
            gradientUnits="userSpaceOnUse">

            <stop offset="0" stop-color="#F8FAFF"/>
            <stop offset="1" stop-color="#EEF2FF"/>

        </linearGradient>

        <linearGradient
            id="buttonGradient"
            x1="370"
            y1="360"
            x2="510"
            y2="395"
            gradientUnits="userSpaceOnUse">

            <stop offset="0" stop-color="#2563EB"/>
            <stop offset="1" stop-color="#7C3AED"/>

        </linearGradient>

        <filter
            id="shadow"
            x="30"
            y="20"
            width="560"
            height="430"
            filterUnits="userSpaceOnUse">

            <feDropShadow
                dx="0"
                dy="18"
                stdDeviation="18"
                flood-color="#1E293B"
                flood-opacity="0.12"/>

        </filter>
    </defs>


    <!-- Main browser window -->

    <rect
        x="55"
        y="35"
        width="510"
        height="380"
        rx="18"
        fill="white"
        filter="url(#shadow)"/>


    <!-- Browser top bar -->

    <rect
        x="55"
        y="35"
        width="510"
        height="55"
        rx="18"
        fill="url(#windowGradient)"/>

    <rect
        x="55"
        y="72"
        width="510"
        height="18"
        fill="url(#windowGradient)"/>


    <!-- Traffic lights -->

    <circle
        cx="82"
        cy="62"
        r="6"
        fill="#EF4444"/>

    <circle
        cx="101"
        cy="62"
        r="6"
        fill="#F59E0B"/>

    <circle
        cx="120"
        cy="62"
        r="6"
        fill="#22C55E"/>


    <!-- Browser title -->

    <rect
        x="190"
        y="51"
        width="170"
        height="22"
        rx="7"
        fill="#E2E8F0"/>


    <!-- Tabs -->

    <rect
        x="80"
        y="105"
        width="180"
        height="42"
        rx="8"
        fill="#EFF6FF"/>

    <text
        x="108"
        y="131"
        font-family="Arial, sans-serif"
        font-size="14"
        font-weight="600"
        fill="#2563EB">
        Your Code
    </text>


    <text
        x="305"
        y="131"
        font-family="Arial, sans-serif"
        font-size="14"
        font-weight="500"
