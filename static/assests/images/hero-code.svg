    </text>


    <text
        x="120"
        y="282"
        font-family="monospace"
        font-size="11"
        fill="#C084FC">
        return
    </text>

    <text
        x="168"
        y="282"
        font-family="monospace"
        font-size="11"
        fill="#94A3B8">
        result
    </text>


    <text
        x="120"
        y="304"
        font-family="monospace"
        font-size="11"
        fill="#64748B">
