    </text>

    <text
        x="178"
        y="260"
        font-family="monospace"
        font-size="11"
        fill="#FBBF24">
        a
    </text>

    <text
        x="190"
        y="260"
        font-family="monospace"
        font-size="11"
        fill="#E2E8F0">
        +
    </text>

    <text
        x="204"
        y="260"
        font-family="monospace"
        font-size="11"
        fill="#FBBF24">
